# BG3 VR core settings.
# tools/deploy.ps1 copies this to <game>\bin\bg3vr\bg3vr.ini on first deploy only; edit that copy.

[dev]
# Open a console window that mirrors bg3vr.log. Off by default: a process has only one console,
# and the Script Extender uses it for its Lua prompt. Everything is in bg3vr.log anyway.
console = false
# debug | info | warn | error
log_level = debug

[scan]
# Scan the game's .text section at startup for the patterns in signatures.txt.
signatures = true
