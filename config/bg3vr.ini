# BG3 VR core settings.
# tools/deploy.ps1 copies this to <game>\bin\bg3vr\bg3vr.ini on first deploy only; edit that copy.

[dev]
# Open a console window that mirrors bg3vr.log. Off by default: a process has only one console,
# and the Script Extender uses it for its Lua prompt. Everything is in bg3vr.log anyway.
console = false
# debug | info | warn | error
log_level = debug

[scan]
# Scan the game's .text section at startup for the patterns in signatures.txt.
signatures = true

[camera]
# Phase 0 camera experiment: watch the bridge file written by `!vr_cam_set` (Client/CameraProbe.lua),
# hook the active camera controller's Update and hold the requested pose.
bridge = true
# Defaults to %LOCALAPPDATA%\Larian Studios\Baldur's Gate 3\Script Extender\BG3VR\camera_bridge.txt
# bridge_file =
# Also overwrite the built view matrix at the setter (the Phase 0 method). Off: the pose is written
# into the camera's Transform instead, and the setter hook only checks the result.
force_view = false
# While a pose is held, hold the middle mouse button and drag to look around (a desktop stand-in for
# head rotation). Sensitivity in degrees per pixel.
mouselook = true
mouselook_sensitivity = 0.15

[xr]
# Phase 1: open an OpenXR session (SteamVR) on the game's own D3D11 device. Needs SteamVR running
# with the headset connected before the game starts; the session opens on the first presented
# frame. Off by default.
enabled = false
# screen     the game on a flat virtual screen in front of you
# mono       head tracking: the headset drives the camera while a pose is held (!vr_cam_set here),
#            each frame shown to both eyes (correct scale and rotation, no depth)
# alternate  as mono, frames alternate between the left and right eye (stereo, ghosting in motion)
# mono and alternate show the screen while no pose is held.
mode = screen
# The virtual screen: width in metres, and its distance in front of where your head was when the
# session started.
screen_width_m = 3.0
screen_distance_m = 2.5
# Game units per metre of head and hand movement and of the eyes' separation (BG3 units are metres: 1.0 is true
# scale; above 1 the world feels smaller, below 1 bigger). The VR menu's Scale page sets it live.
world_scale = 1.0
# The distance between your eyes in mm: 0 uses the headset's own IPD (its IPD setting); 40-90 forces that value.
ipd_mm = 0
# Camera updates between a frame's pose and its Present: auto finds it by looking for the view
# matrix in the frame being presented; 0..7 sets it. Change it live with !vr_xr_lag.
lag = auto
# Let the game's own vsync setting wait for the monitor while the headset runs. Off: Present never
# waits for the desktop's refresh, so the headset (72/90/120 Hz) paces the game, not the monitor.
desktop_vsync = false
# Motion controllers (Touch, Index, Vive, simple): poses, buttons and haptics, logged as 'xr input:'
# lines (button presses, tracking changes, poses every 900 frames). !vr_hands logs them now,
# !vr_hands buzz also pulses both hands.
input = true
# A short pulse on each grip press, to show the haptics path works.
input_haptics = true

[quality]
# Model and texture quality near the player (agent H's findings; logged as 'quality:' lines, !vr_quality).
# Every option here is off by default; the game's own graphics settings are already at their best values.
# Only LOD-0 (highest-detail) meshes, no LOD distance test:
force_lod0 = false
# The small-object ("detail distance") cull; false turns it off:
detail_cull = true
# Multiplies every texture-level distance (game value 1.0). An eye view draws half the window, which
# brings texture levels in to about 0.7x the distance (see the quality: log); 1.5-2.0 makes up for it. Empty = game value.
texture_distance =
# Texture streaming budget in MiB (the game caps it at ~1024-1280). 0 = leave the game's value.
texture_budget_mb = 0

[dialogue]
# Keep dialogues in first person (agent G): for these timeline types the game's dialogue camera never takes the
# view, so the headset keeps driving it. Every timeline is logged as a 'dialogue:' line with its type; add or
# remove types after seeing which ones are conversations and which are cutscenes (2 and 3 are combat
# cinematics). Comma-separated; empty = none.
first_person_types = 1
# Only while the mod drives the camera (a pose is held, e.g. after !vr_go); false = also on the desktop.
only_in_vr = true

[pick]
# Point with the right controller instead of the mouse: the game's picking ray (hovered character/item, ground
# position, path preview, click target) comes from the right hand's aim ray. Also !vr_pick hand|off.
hand = false

[locomotion]
# Walk with the left thumbstick, relative to where you look (the game's own movement-input override; agent J).
# Also !vr_move stick|off. Turning it on bypasses one controller-mode check in the game's movement task.
stick = false
deadzone = 0.15
# If pushing forward walks backwards (to be checked in the first run):
invert_forward = false

[vr]
# VR play: starts automatically when the headset is ready and a game is running (Client/VRAuto.lua), or with !vr_go.
# Set autostart = false to start it by hand (!vr_go) instead.
autostart = true
# What turns on with it:
hand_pointing = true
stick_locomotion = true
# Right stick: snap (default) or smooth turning, and up/down scrolls like the mouse wheel.
turn = snap
snap_degrees = 30
smooth_degrees_per_second = 120
stick_scroll = true
# Comfort vignette: the view's edges darken while you walk or smooth-turn with the sticks (0 = off, 1 = strongest).
comfort_vignette = 0.5
# When a cutscene or dialogue places your character's body somewhere else, the view comes along; with this on it
# also turns to where the body faces.
teleport_turn = true
# Eye height from the character's own eye bones (Dummy_EyeFX_01/02; so every race sees from its own eyes), plus this
# offset in metres (skeletons without eye bones use the head bone + 0.10 m).
auto_eye_height = true
# The hand that points (laser, touching panels, the VR menu, picking, melee) and gets the right_* bindings; the
# other hand carries the wrist UI and walks with its stick. right | left.
dominant_hand = right
eye_offset = 0

[ui]
# The game's UI on a VR panel while VR play is on (agent F): the UI texture is copied onto a panel in front of you
# (placed when VR starts and on recentre) and taken out of the eye images. The right hand's laser moves the mouse
# cursor on it, so the trigger clicks UI buttons; pointing away from the panel parks the cursor in the middle.
panel = true
remove_from_eyes = true
laser = true
# wrist: on the back of the left wrist (raise it like reading a watch; point or touch with the right hand); world: a
# panel in front of you (placed at start and on recentre). The left stick click switches between them (binding
# "panel"), and so does the VR menu.
placement = wrist
# The wrist panel: width, how far off the back of the hand and how far up the forearm its centre sits (metres).
wrist_width = 0.4
wrist_out = 0.045
wrist_along = 0.2
# The world panel's size and place, in metres.
width = 1.1
distance = 1.0
below_eyes = 0.15
# The characters shown inside UI screens (inventory, character sheet, party, trade, ...) are live offscreen renders
# (agent P). diagnose: log each one (texture, format, background alpha) for the stereo version; hide: also take the
# flat picture out of the UI; normal: leave them alone.
paperdoll = diagnose
# The VR menu (left menu button, binding "vrmenu"): its width and distance in metres. Its settings are saved to
# menu.ini next to this file, which overrides the values here; delete menu.ini to go back to them.
menu_width = 0.62
menu_distance = 0.7

[menu]
enabled = true

[pointer]
# The aiming beam from the pointing hand into the world, ending where it hits the ground, a character or an item.
# style: off | solid | dashed | dots (flowing) | pulse; colour: gold | white | blue | green | red | purple;
# opacity 0.05..1; width in screen heights at the hand; range: metres when nothing is hit. The VR menu sets the first
# three live.
style = dots
colour = gold
opacity = 0.55
width = 0.006
range = 12

[render]
# The game's render resolution in VR, as a percentage of the headset's recommended size per eye (the back buffer
# becomes both eyes side by side; the desktop window shows it scaled). 0 = the game's own resolution setting. Through
# the game's own resize (agent O), so DLSS / FSR keep working per eye. The VR menu's View page sets it live.
vr_resolution = 80

[holster]
# Holsters on the body (first person): squeeze a grip over a shoulder or at a hip and pull the hand out to draw,
# carry it back to a holster and let go to put it away; squeeze behind your back (low, between the shoulder blades)
# for the inventory. Zone sizes in metres; hip_drop is how far below the eyes the hips are.
enabled = true
shoulder_radius = 0.17
hip_radius = 0.15
hip_drop = 0.78
hip_width = 0.22
back_radius = 0.13
# What each holster holds: melee (the melee weapon set), ranged (the ranged set: bows, crossbows), inventory, none.
# Drawing switches the character to that set first (a server hook, agent L); without a ranged weapon the melee set
# is drawn.
shoulder_right = melee
shoulder_left = ranged
hip_right = melee
hip_left = melee
back = inventory
# The chest (squeeze at the middle of your chest): a flame with its light in that hand, again to put it out.
chest = light
chest_radius = 0.09
weapon_sets = true

[ik]
# The character's arms follow the controllers (hands at the grips, elbows bent down, the held weapon with them).
# The chain found in game: Shoulder_R / Elbow_R / Wrist_R (and _L). !vr_ik on|off.
arms = true
# The chain is found from the weapon bones (hand = parent of Dummy_R_Hand / Dummy_L_Hand, then its parents);
# bone names here replace that (see the skeleton's bone list in bg3vr.log).
right_upper =
right_lower =
right_hand =
# Arms: stretch lets an arm get up to this much longer to keep the hand on the controller; elbow = natural (Parger et
# al. 2018: the elbow from where the hand is relative to the shoulder, kept away from flips near the shoulder, and
# moved when the wrist turns past a comfortable range: elbow_wrist) or down (always below the arm).
stretch = 1.15
elbow = natural
elbow_wrist = true
left_upper =
left_lower =
left_hand =
# weapon: what the hand holds sits in your fist at the controller's angle (the weapon bone follows the grip);
# relative: the hand turns with the controller from where it was when IK started. The weapon angle, in degrees, tilts
# it in the grip (pitch: the blade forward/back, yaw: left/right, roll: about the blade); the VR menu sets the pitch.
# left_weapon_pitch / _yaw / _roll do the same for the left hand (default: the right hand's values).
hands = weapon
weapon_pitch = 0
weapon_yaw = 0
weapon_roll = 0

[grab]
# Dead bodies: close a hand on a body part (within body_reach metres of the hand) to grab it; the game's ragdoll
# follows the hand and letting go mid-swing throws it (x body_throw of the hand's speed). For now a body stays within
# about a metre of where it lay (the game's ragdoll tether).
bodies = true
body_reach = 0.45
body_throw = 1.0
# Picking items up with the grips (Half-Life: Alyx style; first stage). probe = true logs what a grip would grab
# (hit, entity, client item); hold = true picks it up, carries it with the hand and puts it down where you let go
# (the final position goes to the server). Off until the probe's 'grab:' lines look right. While on, the grips
# grab instead of right-clicking.
probe = false
hold = false
# How far the hand's aim ray reaches for a grab, in metres.
reach = 1.5
# With hold on: let go while moving the hand faster than this (m/s) and the item flies on (thrown).
throw = true
throw_min_speed = 1.5
# With hold on: aim at an item up to pull_range away, hold the grip and flick the hand back; it flies into the hand
# and is caught within catch_radius (Half-Life: Alyx gravity gloves).
pull = true
pull_range = 6.0
catch_radius = 0.35

[combat]
# Combat through the game's own click, so its rules decide everything (rolls, range, action costs, prepared abilities).
# swing: gaze = with a melee weapon drawn, a quick swing clicks on the character you look at within reach (the attack,
#   or the prepared weapon ability / spell); hit = the blade has to pass through a character (physical); off.
# bow: draw = bring the pointing hand's grip to the bow hand, pull back and let go to shoot along the arrow; off = aim
#   and click like a crossbow. reach: metres from the eyes for a swing's target; swing_speed: m/s of the hand.
swing = gaze
bow = draw
reach = 2.5
swing_speed = 2.0
full_draw = 0.45
# Physical melee: swing the right hand through a character and the game makes its normal weapon attack against it
# (Osi.Attack, with the dice roll), outside or inside turn-based combat. The blade is a line along the right hand's
# pointing direction. Off by default.
physical = false
blade = 0.9
min_speed = 2.5
cooldown = 0.8

[bindings]
# Controller buttons become the game's own mouse/keyboard input (the game stays in mouse mode, so the UI and the
# laser keep working). Values: mouse_left, mouse_right, mouse_middle, key:<name> (a-z, num_0-9, f1-f12, escape,
# enter, space, tab, lalt, lshift, lctrl, ...), recenter (hold), panel (UI to the wrist and back), view (first /
# third person), vrmenu (the VR menu), or none. Keys assume BG3's default PC key bindings.
right_trigger = mouse_left
right_grip = mouse_right
right_a = key:i
right_b = key:escape
right_stick_click = recenter
left_trigger = key:lalt
left_grip = none
left_x = key:m
left_y = view
left_menu = vrmenu
left_stick_click = panel

[combos]
# Hold the first button, press the second: the second's own binding doesn't fire, and a first button with a key or
# mouse binding of its own fires it on release instead (unless a combo was used). Same values as [bindings].
left_grip+right_a = key:n
left_grip+right_b = key:j
left_grip+left_x = key:k
left_grip+left_y = key:tab
left_grip+right_trigger = key:space
left_grip+right_stick_click = key:c

[views]
# Keeping the two eyes consistent: the second eye uses the main eye's exposure (no lighting difference between the
# eyes), and its per-object data pass waits for the main eye's recording (no flicker from the shared slots).
shared_exposure = true
serialize_eyes = true
# Agent N: the lighting, fog and motion-vector shaders rebuild positions from per-view data and from stages that read
# the head camera directly. eye_reprojection: stage 0x1B's lighting history uses each eye; eye_velocity: stage 0x40's
# motion vectors / TAA use each eye. (The per-view corner rays and inverse view are always rewritten with the eye.)
eye_reprojection = true
eye_velocity = true

[trace]
# Reverse engineering: install the !vr_trace hooks during start-up, to catch calls that only happen
# while the game starts (pipeline building). !vr_trace off removes them and logs what they saw.
startup = false
